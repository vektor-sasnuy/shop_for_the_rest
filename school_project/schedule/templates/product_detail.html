<!DOCTYPE html>
{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 32px 24px;
        }
        .product-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .product-price {
            color: #d63333;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .product-description {
            margin-bottom: 18px;
        }
        .btn-back {
            margin-top: 24px;
        }
        .product-info {
            font-size: 1rem;
            color: #555;
            margin-bottom: 10px;
        }
        .product-img {
            display: block;
            margin: 0 auto 24px auto;
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="product-title">{{ product.name }}</h1>
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="product-img">
        {% endif %}
        <div class="product-price">{{ product.price }} грн</div>
        <div class="product-description">{{ product.description }}</div>
        {% if product.brand %}
        <div class="product-info"><b>Бренд:</b> {{ product.brand }}</div>
        {% endif %}
        {% if product.category %}
        <div class="product-info"><b>Категорія:</b> {{ product.category }}</div>
        {% endif %}
        <a href="/" class="btn btn-outline-secondary btn-back">Назад до каталогу</a>
    </div>
</body>
</html>
